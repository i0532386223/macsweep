[package]
name = "macsweep"
version = "0.3.0"
edition = "2024"
description = "A fast, lightweight, open-source Mac cleaner"
license = "MIT"
repository = "https://github.com/nihal4/macsweep"
authors = ["S. M. Nihal Ahmed"]

[dependencies]
blake3 = "1.8.7"
# No bundled text fonts: on macOS MacSweep uses the system's own (see theme.rs).
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }
icns = { version = "0.5.0", default-features = false, features = ["pngio"] }
png = "0.18"
rusqlite = "0.37"
jwalk = "0.9.0"
libc = "0.2.191"
memmap2 = "0.9.12"
plist = "1.10.3"
rayon = "1.12.0"
serde_json = "1"
snap = "1"
trash = "5.3.0"

# macOS only: Foundation for the thermal state in Mac Health
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3.2"

# Linux only so the code can be checked on Linux (Linux has no San Francisco,
# so it keeps egui's own fonts); macOS needs nothing extra
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11"] }

[dev-dependencies]
# Same version egui already uses, to check fonts in tests.
skrifa = "0.44"

[workspace]
members = [".", "monitor"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
