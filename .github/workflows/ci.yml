# Runs on every pull request and every push to main.
# A pull request can only be merged when this passes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Needed when the action is pinned to a commit instead of @stable.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Formatting
        run: cargo fmt --check

      - name: No warnings
        # The macOS-only code is only compiled here, so catch warnings in CI.
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::all

      - name: Safety tests
        run: cargo test --workspace

      - name: Build the app
        run: ADHOC=1 ./bundle.sh
