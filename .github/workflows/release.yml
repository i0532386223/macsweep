# Push a tag like v0.1.0 and GitHub builds a universal MacSweep.app
# and attaches it to a new Release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Needed when the action is pinned to a commit instead of @stable.
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build universal app
        run: ADHOC=1 UNIVERSAL=1 ZIP=1 ./bundle.sh

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo "**Download \`MacSweep-${GITHUB_REF_NAME#v}.zip\`, unzip, and move MacSweep to Applications.**"
            echo
            echo "The app isn't notarized by Apple yet, so macOS blocks the first launch."
            echo "Open it once, then go to **System Settings → Privacy & Security** and click **Open Anyway**."
            echo "Or run this once in Terminal: \`xattr -dr com.apple.quarantine /Applications/MacSweep.app\`"
            echo
            echo "Then turn on MacSweep in **System Settings → Privacy & Security → Full Disk Access**."
            echo "Works on Apple Silicon and Intel Macs (macOS 11+)."
            echo
            # This version's section of CHANGELOG.md (without its heading).
            awk -v v="## ${GITHUB_REF_NAME}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/MacSweep-*.zip
          body_path: notes.md
          generate_release_notes: true
